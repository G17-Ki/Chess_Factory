<style>
:root{--bg:#f2f5f2;--card:#fff;--line:#dfe7e1;--ink:#24332c;--soft:#65776c;--jade:#267c5b;--jade-soft:#e4f1e9;--red:#a8442c;--black:#27332e;--amber:#b67922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}

.board-wrap{display:flex;flex-direction:column;align-items:center}.board{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,590px);aspect-ratio:9/10;border:3px solid #8a5c36;background:#e4bd7b;box-shadow:0 12px 32px -18px rgba(84,51,20,.5);position:relative}.cell{display:flex;align-items:center;justify-content:center;position:relative;border-right:1px solid rgba(99,62,28,.4);border-bottom:1px solid rgba(99,62,28,.4)}.cell:nth-child(9n){border-right:0}.cell:nth-last-child(-n+9){border-bottom:0}.piece{width:78%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff8e9;border:2px solid currentColor;font-family:serif;font-weight:700;font-size:clamp(18px,4vw,32px);line-height:1;box-shadow:0 1px 3px rgba(60,30,10,.25)}.piece.red{color:var(--red)}.piece.black{color:var(--black)}.cell.from::before,.cell.to::before{content:"";position:absolute;inset:4px;border-radius:6px;background:rgba(46,139,106,.22);z-index:0}.cell.to::before{background:rgba(207,138,46,.35)}.piece{z-index:1}
.status{display:flex;justify-content:space-between;gap:8px;width:100%;margin:12px 0 8px;color:var(--soft);font-size:13px}.current-move{color:var(--jade);font-weight:700;font-size:18px}.move-list{display:flex;flex-wrap:wrap;gap:5px;max-height:260px;overflow:auto}.move{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;color:var(--soft)}.move:hover{border-color:var(--jade);color:var(--jade)}.move.active{background:var(--jade);color:#fff;border-color:var(--jade)}.move .num{opacity:.6;margin-right:3px;font-size:11px}
.fen{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--soft);background:#f7f9f7;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}.quote,.explain{font-size:13px;color:var(--soft);white-space:pre-wrap}.quote{padding-left:12px;border-left:3px solid var(--jade-soft)}.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade);font-size:11px;margin:0 5px 5px 0}.tag.warn{background:#fbf1df;color:#8a5a14}a{color:var(--jade)}.raw{max-height:340px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}.small{font-size:12px;color:var(--soft)}
.list-caption{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:var(--soft);font-size:11px}.course-heading{position:sticky;top:-10px;z-index:2;margin:4px -3px 0;padding:7px 6px 4px;background:var(--card);color:var(--jade);font-size:11px;font-weight:700}.variation{--depth:0;padding-left:calc(9px + var(--depth)*13px)}.variation .tree-mark{display:inline-block;width:16px;margin-left:-13px;opacity:.5}.branch-nav{width:100%;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.branch-nav h3{margin-top:0}.branch-buttons{display:flex;flex-direction:column;gap:6px}.branch-button{border:1px solid var(--line);background:#f8faf8;border-radius:9px;padding:7px 9px;text-align:left;color:var(--soft)}.branch-button:hover{border-color:var(--jade);color:var(--jade)}.branch-button.parent{margin-bottom:5px}.branch-button.current-branch{border-color:#bdd9ca;background:var(--jade-soft);color:var(--jade)}.branch-point{display:block;font-size:11px;opacity:.75}.lineage{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.lineage button{border:0;background:var(--jade-soft);border-radius:7px;padding:4px 7px;color:var(--jade);text-align:left;font-size:11px}.lineage button.active{background:var(--jade);color:#fff}.lineage-arrow{color:#9bab9f;font-size:11px}.practice-panel{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8faf8}.practice-panel .controls{align-items:center}.practice-panel p{margin:7px 0 0}.practice-on .practice-panel{border-color:#bdd9ca;background:var(--jade-soft)}.practice-on #teachingNotes{display:none}.move.concealed{border-style:dashed;color:#9bab9f;cursor:default}.move.concealed:hover{border-color:var(--line);color:#9bab9f}button:disabled,select:disabled{opacity:.45;cursor:not-allowed}.shortcuts{width:100%;margin-top:10px;color:var(--soft);font-size:11px}.shortcuts summary{cursor:pointer}.shortcuts p{margin:6px 0}.shortcut-key{display:inline-block;min-width:20px;padding:0 4px;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:center;font-family:ui-monospace,monospace}.practice-note{color:var(--jade);font-weight:600}

</head>
<body>
<header><div class="hero"><h1>黄丹青完整课程开局棋谱</h1><p>15 门完整课程 · 228 条变化 · 1001 着 · 全部离线数据与逐步 FEN</p><div class="chips"><span class="chip"><b>228</b> 条变化</span><span class="chip"><b>1001</b> 着</span><span class="chip">分支树与父子跳转</span><span class="chip">脱谱练习</span><span class="chip">视频与规则校验</span><span class="chip">无引擎评分</span></div></div></header>
<main class="layout">
<section class="panel">
  <h2>课程与分支树</h2>
  <div class="controls"><input id="search" placeholder="搜索开局、着法或变化 ID（/）" aria-label="搜索"></div>
  <div class="controls"><select id="course" aria-label="课程"></select></div>
  <div class="list-caption"><span id="resultSummary"></span><span>缩进表示分支层级</span></div>
  <div id="variations" class="variations"></div>
</section>
<section class="panel board-wrap">
  <div class="status" aria-live="polite"><span id="counter">0 / 0</span><span class="current-move" id="currentMove">选择变化</span></div>
  <div id="board" class="board" role="img" aria-label="中国象棋棋盘"></div>
  <div class="status"><span id="moveName"></span><span id="side"></span></div>
  <div class="controls">
    <button id="start" title="回到起始局面（Home）">⏮ 起点</button><button id="prev" title="上一步（←）">← 上一步</button><button id="play" class="active" title="自动播放或暂停（空格）">▶ 播放</button><button id="next" title="下一步（→）">下一步 →</button><button id="end" title="最后局面（End）">终点 ⏭</button><button id="flip" title="翻转棋盘（F）" aria-pressed="false">翻转</button><select id="speed" title="播放速度"><option value="1200">慢速</option><option value="800" selected>标准</option><option value="400">快速</option></select>
  </div>
  <div class="practice-panel">
    <div class="controls"><button id="practice" aria-pressed="false" title="脱谱练习（P）">◎ 脱谱练习</button><select id="practiceScope" aria-label="练习范围" disabled><option value="segment">只练当前变化</option><option value="full">从初始局面练到本分支</option></select><button id="restartPractice" disabled>重新测试</button></div>
    <p class="small" id="practiceNote">开启后隐藏后续着法与讲解，先想下一着，再按 → 核对。</p>
  </div>
  <div id="branches" class="branch-nav"></div>
  <h3 id="movesTitle">本段着法</h3><div id="moves" class="move-list"></div>
  <div id="fen" class="fen"></div>
  <details class="shortcuts"><summary>键盘快捷键</summary><p><span class="shortcut-key">←</span> 上一步　<span class="shortcut-key">→</span> 下一步／揭示　<span class="shortcut-key">Home</span> 起点　<span class="shortcut-key">End</span> 终点</p><p><span class="shortcut-key">空格</span> 播放／暂停（练习时揭示）　<span class="shortcut-key">F</span> 翻转　<span class="shortcut-key">P</span> 练习　<span class="shortcut-key">/</span> 搜索</p></details>
</section>
<aside class="panel details">
  <h2 id="title">选择一条变化</h2>
  <div id="tags"></div>
  <p class="small" id="source"></p>
  <h3>分支路径</h3><div id="lineage" class="lineage"></div>
  <div id="teachingNotes"><h3>老师原讲</h3><div id="quote" class="quote"></div><h3>变化说明</h3><div id="explanation" class="explain"></div></div>
  <h3>验证状态</h3><div id="verification"></div>
  <div class="controls" style="margin-top:12px"><button id="copy" class="btn">复制当前 FEN</button><button id="rawBtn" class="btn">查看原始数据</button><a id="jsonLink" class="btn" target="_blank" rel="noopener">打开 JSON</a></div>
  <pre id="raw" class="raw hidden"></pre>
</aside>
</main>

$('play').onclick=()=>{if(state.practice)return;if(state.playing){stopPlaying();renderAll();return}if(state.ply===activeLine().moves.length)state.ply=0;state.playing=true;state.timer=setInterval(()=>{if(state.ply>=activeLine().moves.length){stopPlaying();renderAll()}else step(1)},state.speed);renderAll()};
$('speed').onchange=e=>{state.speed=Number(e.target.value);if(state.playing){stopPlaying();$('play').click()}};
$('flip').onclick=()=>{state.flipped=!state.flipped;renderBoard();renderPractice()};$('search').oninput=renderVariations;$('course').onchange=e=>{state.course=e.target.value;const list=filtered();if(list.length)selectVariation(list[0].id);else renderVariations()};
$('practice').onclick=()=>setPractice(!state.practice);$('restartPractice').onclick=goStart;$('practiceScope').onchange=e=>{state.practiceScope=e.target.value;state.ply=0;renderAll()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('fen').textContent);$('copy').textContent='已复制'}catch(e){$('copy').textContent='请手动复制'}};
$('rawBtn').onclick=()=>{if(state.practice)return;const raw=$('raw');raw.classList.toggle('hidden');$('rawBtn').textContent=raw.classList.contains('hidden')?'查看原始数据':'收起原始数据'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopPlaying();if(document.activeElement===$('search'))$('search').blur();renderAll();return}if(e.target.matches('input,select,textarea,[contenteditable="true"]')||e.ctrlKey||e.metaKey||e.altKey)return;const key=e.key.toLowerCase();if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}else if(e.key==='ArrowRight'){e.preventDefault();step(1)}else if(e.key===' '){e.preventDefault();state.practice?step(1):$('play').click()}else if(e.key==='Home'){e.preventDefault();goStart()}else if(e.key==='End'){e.preventDefault();goEnd()}else if(key==='f'){e.preventDefault();$('flip').click()}else if(key==='p'){e.preventDefault();setPractice(!state.practice)}else if(e.key==='/'){e.preventDefault();$('search').focus()}});
state.variation='HDQ-C03-03';renderAll();
</script>
</body></html>
